apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{APP_NAME}}
  namespace: {{APP_NAME}}
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{DOMAIN}}`) {{PATH_PREFIX}}
      kind: Rule
      services:
        - name: {{APP_NAME}}-external{{SSL_SUFFIX}}
          port: {{PORT}}
          # Uncomment the following lines for HTTPS services that require TLS re-encryption
          # scheme: https
          # serversTransport: "{{APP_NAME}}-transport"
