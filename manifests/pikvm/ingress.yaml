apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: pikvm-tcp
  namespace: pikvm
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`pikvm.cowlab.org`)
      kind: Rule
      services:
        - name: pikvm-external-ssl
          port: 443
      tls:
        passthrough: true