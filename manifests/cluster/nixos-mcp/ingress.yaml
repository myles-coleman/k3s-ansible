apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nixos-mcp
  namespace: nixos-mcp
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nixos-mcp.cowlab.org`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: nixos-mcp
          port: 80
