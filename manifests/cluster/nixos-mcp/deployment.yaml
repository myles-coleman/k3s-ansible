apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixos-mcp
  namespace: nixos-mcp
  labels:
    app: nixos-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nixos-mcp
  template:
    metadata:
      labels:
        app: nixos-mcp
    spec:
      containers:
      - name: nixos-mcp
        image: ghcr.io/utensils/mcp-nixos:v1.0.1
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
