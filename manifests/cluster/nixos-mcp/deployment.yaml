apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixos-mcp
  namespace: nixos-mcp
  labels:
    app: nixos-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nixos-mcp
  template:
    metadata:
      labels:
        app: nixos-mcp
    spec:
      containers:
      - name: nixos-mcp
        image: ghcr.io/beebecomebigbee/nixos-mcp@sha256:175b456247f4dface03f10cfa57c5be66d551e936b151ea826c7a0fc38054264
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
