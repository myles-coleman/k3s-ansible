apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixos-mcp
  namespace: nixos-mcp
  labels:
    app: nixos-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nixos-mcp
  template:
    metadata:
      labels:
        app: nixos-mcp
    spec:
      containers:
      - name: nixos-mcp
        image: beebecomebigbee/nixos-mcp@sha256:ba71814a29e11b9d69d788ca04c973f28109d9a92884404cf2db823004f4e8ad
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
