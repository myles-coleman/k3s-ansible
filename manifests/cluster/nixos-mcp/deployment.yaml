apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixos-mcp
  namespace: nixos-mcp
  labels:
    app: nixos-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nixos-mcp
  template:
    metadata:
      labels:
        app: nixos-mcp
    spec:
      containers:
      - name: nixos-mcp
        image: beebecomebigbee/nixos-mcp@sha256:71fcb5fa4aef98bdd27f96145c9c0f18adc1041ffd9acbb50d44f74c0c4e5b7c
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
