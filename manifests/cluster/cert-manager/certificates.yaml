---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: staging-cert
  namespace: cert-manager
spec:
  secretName: staging-cert-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - "*.cowlab.org"
    - "cowlab.org"
