apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: pihole
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pihole.cowlab.org`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: pihole-rewrite
          namespace: pihole
      services:
        - name: pihole-external
          port: 80
