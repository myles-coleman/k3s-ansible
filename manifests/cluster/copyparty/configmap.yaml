apiVersion: v1
kind: ConfigMap
metadata:
  name: copyparty-config
  namespace: copyparty
data:
  copyparty.conf: |
    # copyparty configuration
    [global]
      p: 3923  # listen on port 3923
      e2dsa    # enable file indexing and filesystem scanning
      e2ts     # enable multimedia indexing
      hist: /cfg/hists/  # store history in config folder
    
    # create default user accounts
    [accounts]
      admin: changeme123  # Change this password!
    
    # create volumes - main shared folder
    [/]
      /w
      accs:
        r: *      # everyone gets read-access
        rw: admin # admin gets read-write
    
    # config folder for uploads
    [/uploads]
      /w/uploads
      accs:
        w: *      # anyone can upload
        rw: admin # admin can manage uploads
      flags:
        e2d       # enable uploads database
        nodupe    # reject duplicate uploads
