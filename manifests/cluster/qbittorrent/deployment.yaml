apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: WEBUI_PORT
          value: "8080"
        - name: TORRENTING_PORT
          value: "6969"
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6969
          name: torrenting
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /config
        # - name: torrents-volume
        #   mountPath: /data/torrents
      volumes:
      - name: config-volume
        persistentVolumeClaim:
          claimName: qbittorrent-config
      # - name: torrents-volume
      #   hostPath:
      #     path: /mnt/md0/data/torrents
