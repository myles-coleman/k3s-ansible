apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - persistent-volume-claim.yml
  - persistent-volume.yml
  - deployment.yml
  - service.yml
  - ingress.yml

namespace: homer

configMapGenerator:
  - name: homer-config
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-options: Replace=true
    behavior: create
    files:
     - config.yml=config.yml

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                    - key: node-type
                      operator: In
                      values:
                        - raspberry-pi
    target:
      kind: Deployment