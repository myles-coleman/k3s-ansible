apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - persistent-volume-claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

namespace: homer

configMapGenerator:
  - name: homer-config
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-options: Replace=true
    behavior: create
    files:
     - config.yml=config.yaml
