apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-config-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: smb-homer-assets
    volumeAttributes:
      source: "//10.0.0.150/media"
    nodeStageSecretRef:
      name: smb-secret
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: smb-homer-assets
    volumeAttributes:
      source: "//10.0.0.150/media"
    nodeStageSecretRef:
      name: smb-secret
      namespace: kube-system
