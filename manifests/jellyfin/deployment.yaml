apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        ports:
        - containerPort: 8096
        volumeMounts:
        - name: config-volume
          mountPath: /config
          subPath: jellyfin/config
        - name: data-volume
          mountPath: /data
          subPath: media
      volumes:
      - name: config-volume
        hostPath:
          path: /mnt/md0/docker-config
          type: Directory
      - name: data-volume
        hostPath:
          path: /mnt/md0/data
          type: Directory
