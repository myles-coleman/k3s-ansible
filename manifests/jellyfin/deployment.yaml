apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: data-volume
          mountPath: /data
        # - name: config-volume
        #   mountPath: /config
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: jellyfin-data
      # - name: config-volume
      #   persistentVolumeClaim:
      #     claimName: jellyfin-config
