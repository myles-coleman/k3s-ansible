apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - persistent-volume-claim.yml
  - persistent-volumes.yml
  - deployment.yml
  - service.yml
  - ingress.yml

patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-type
                      operator: In
                      values:
                        - raspberry-pi
    target:
      kind: Deployment