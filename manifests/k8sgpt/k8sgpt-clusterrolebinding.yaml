# k8sgpt-clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sgpt-operator-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: k8sgpt-operator-controller-manager
    namespace: k8sgpt-operator-system  # Update if different
roleRef:
  kind: ClusterRole
  name: k8sgpt-operator-clusterrole
  apiGroup: rbac.authorization.k8s.io
