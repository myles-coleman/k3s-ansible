apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-letsencrypt-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /mnt/md0/docker-config/nginx/letsencrypt
    server: 10.0.0.150
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-data-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /mnt/md0/docker-config/nginx/data
    server: 10.0.0.150
  persistentVolumeReclaimPolicy: Retain

